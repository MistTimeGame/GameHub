```html
<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game Platform</title>


<link rel="stylesheet" href="style.css">


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


</head>


<body>


<div class="app">



<!-- ЛЕВАЯ ПАНЕЛЬ -->

<aside class="sidebar">


<div class="logo">
GAME HUB
</div>



<button class="nav-btn active" onclick="openPage('home')">
🏠 Главная
</button>


<button class="nav-btn" onclick="openPage('games')">
🎮 Игры
</button>


<button class="nav-btn" onclick="openPage('guilds')">
⚔ Гильдии
</button>


<button class="nav-btn" onclick="openPage('profile')">
👤 Профиль
</button>


<button class="nav-btn" onclick="openPage('chat')">
💬 Чат
</button>


<button class="nav-btn" onclick="openPage('conference')">
🎤 Конференция
</button>



<div class="account-panel">


<button 
id="loginButton"
class="nav-btn"
onclick="openPage('auth')">

🔐 Войти

</button>



<button 
id="logoutButton"
class="nav-btn hidden"
onclick="logout()">

🚪 Выйти

</button>


</div>


</aside>






<!-- ОСНОВА -->

<main class="content">





<!-- ГЛАВНАЯ -->

<section id="home" class="page active">


<div class="card">


<h1>
Game Platform
</h1>


<p>
Игровая платформа для игроков, гильдий и сообществ.
</p>


<div id="welcome">

</div>


</div>


</section>







<!-- АВТОРИЗАЦИЯ -->


<section id="auth" class="page">


<div class="card">


<h2>
Авторизация
</h2>



<input 
id="email"
placeholder="Email">



<input 
id="password"
type="password"
placeholder="Пароль">



<input 
id="nickname"
placeholder="Никнейм">



<button 
class="main-btn"
onclick="register()">

Регистрация

</button>



<button 
class="main-btn"
onclick="login()">

Войти

</button>



<div id="authMessage">

</div>


</div>


</section>









<!-- ПРОФИЛЬ -->


<section id="profile" class="page">


<div class="card">


<h2>
Профиль игрока
</h2>



<img 
id="avatar"
class="avatar"
src="https://i.imgur.com/6VBx3io.png">



<input
id="avatarUrl"
placeholder="Ссылка на аватар">



<input
id="profileNick"
placeholder="Ник">


<input
id="profileCity"
placeholder="Город">



<input
id="profileAge"
type="number"
placeholder="Возраст">



<div class="vip">

VIP уровень:
<span id="vipLevel">
0
</span>

</div>



<button
class="main-btn"
onclick="saveProfile()">

Сохранить профиль

</button>



</div>


</section>









<!-- ИГРЫ -->


<section id="games" class="page">


<div class="card">


<h2>
Игры
</h2>


<p>
Каталог игр будет здесь.
</p>


</div>


</section>









<!-- ГИЛЬДИИ -->


<section id="guilds" class="page">


<div class="card">


<h2>
Гильдии
</h2>


<p>
Игровые сообщества.
</p>


</div>


</section>









<!-- ЧАТ -->


<section id="chat" class="page">


<div class="card chat-box">


<h2>
Общий чат
</h2>



<div id="messages">

</div>



<div class="chat-input">


<input 
id="messageText"
placeholder="Сообщение...">



<button 
class="main-btn"
onclick="sendMessage()">

Отправить

</button>


</div>



</div>


</section>









<!-- КОНФЕРЕНЦИЯ -->


<section id="conference" class="page">


<div class="card">


<h2>
Конференция
</h2>



<p>
Участники онлайн:
</p>



<div id="onlineUsers">

</div>



<button
class="main-btn"
onclick="joinConference()">

Войти в конференцию

</button>



<button
class="main-btn"
onclick="leaveConference()">

Покинуть

</button>



</div>


</section>






</main>


</div>





<script src="app.js"></script>


</body>

</html>
```
