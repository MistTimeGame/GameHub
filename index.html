<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Game Platform
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">


<div class="brand">


<div class="logo">

GP

</div>


<h1>

Game Platform

</h1>


</div>





<nav class="flash-menu">


<div class="menu-item active">

Главная

</div>




<div class="menu-item dropdown">


Игры ▼



<div class="dropdown-content">


<div>
Все игры
</div>


<div>
Новые
</div>


<div>
Популярные
</div>


</div>


</div>





<div class="menu-item">

Гильдии

</div>





<div class="menu-item">

Рейтинг

</div>





<div class="menu-item">

Новости

</div>



</nav>






<div id="userPanel">


<button onclick="openAuth()">

Войти

</button>


</div>



</header>








<main>



<section class="hero">


<h2>

Игровая платформа

</h2>


<p>

Создавайте игровые сообщества, гильдии и проекты

</p>



</section>







<section class="content">


<h2>

Игры

</h2>





<div class="toolbar">


<input

id="search"

placeholder="Поиск игры..."

oninput="searchGames()"

/>




<button onclick="openAddGame()">

Добавить игру

</button>



</div>







<div id="gamesList">


</div>



</section>









<section

id="addGame"

class="card"

hidden>


<h2>

Добавить игру

</h2>




<input

id="gameName"

placeholder="Название игры"

>



<textarea

id="gameDescription"

placeholder="Описание игры">

</textarea>





<input

id="gameImage"

placeholder="Ссылка на изображение"

>





<button onclick="createGame()">

Создать

</button>




</section>









<section

id="authWindow"

class="modal"

hidden>



<div class="modal-box">



<h2>

Вход

</h2>




<input

id="email"

placeholder="Email"

>




<input

id="password"

type="password"

placeholder="Пароль"

>




<button onclick="login()">

Войти

</button>







<hr>







<h3>

Регистрация

</h3>




<input

id="regEmail"

placeholder="Email"

>




<input

id="regPassword"

type="password"

placeholder="Пароль"

>




<input

id="nickname"

placeholder="Никнейм"

>




<button onclick="register()">

Создать аккаунт

</button>




</div>


</section>






</main>







<div id="version">

v1.1.0

</div>






<script src="app.js"></script>


</body>


</html>
