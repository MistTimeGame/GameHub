<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Game Guild Platform
</title>


<link rel="stylesheet" href="style.css">


</head>


<body>



<div id="app">



<!-- ==========================
 HEADER
========================== -->


<header class="main-header">


<div class="logo">

GG

</div>


<h1>
Game Guild Platform
</h1>



<div id="profileBlock">


<button onclick="openLogin()">
Войти
</button>


</div>


</header>







<!-- ==========================
 AUTH WINDOW
========================== -->


<section
id="authWindow"
class="modal"
hidden
>


<div class="modal-box">


<h2>
Авторизация
</h2>



<input
id="loginEmail"
placeholder="Email"
>



<input
id="loginPassword"
type="password"
placeholder="Пароль"
>



<button onclick="login()">
Войти
</button>





<hr>




<h3>
Регистрация
</h3>



<input
id="regEmail"
placeholder="Email"
>



<input
id="regPassword"
type="password"
placeholder="Пароль"
>



<input
id="regName"
placeholder="Никнейм"
>



<button onclick="register()">
Создать аккаунт
</button>



<button onclick="closeLogin()">
Закрыть
</button>


</div>


</section>









<!-- ==========================
 MAIN
========================== -->


<main>




<section class="hero">


<h2>
Игровая платформа гильдий
</h2>


<p>

Создавайте гильдии, объединяйте игроков,
стройте союзы и развивайте свои игровые сообщества.

</p>


</section>








<section class="game-search">


<h2>
Игры
</h2>




<div class="search-line">


<input
id="gameSearch"
placeholder="Поиск игры..."
oninput="searchGames()"
>




<button onclick="openCreateGame()">

Создать игру

</button>



</div>





<div id="gamesList">


</div>




</section>









<!-- ==========================
 CREATE GAME
========================== -->


<section
id="createGame"
class="card"
hidden
>



<h2>
Создать игру
</h2>



<input
id="gameName"
placeholder="Название игры"
>



<textarea
id="gameDescription"
placeholder="Описание игры">
</textarea>




<input
id="gameLogo"
placeholder="Ссылка на логотип"
>




<button onclick="createGame()">

Создать

</button>



</section>









<!-- ==========================
 USER PROFILE
========================== -->


<section
id="profile"
class="card"
hidden
>


<h2>
Профиль
</h2>


<p id="profileName">

</p>


<button onclick="logout()">

Выйти

</button>


</section>






</main>








</div>







<!-- VERSION -->


<div id="siteVersion">

</div>







<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="supabase-config.js"></script>


<script src="version.js"></script>


<script src="app.js"></script>



</body>


</html>
