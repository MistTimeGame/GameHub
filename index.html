<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Game Guild Platform
</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<div id="app">



<header class="top-header">


<div class="logo">
GGP
</div>



<nav>

<button onclick="showHome()">
Игры
</button>


<button onclick="showProfile()">
Профиль
</button>


</nav>



<div id="authBlock">

<button onclick="openAuth()">
Войти
</button>

</div>



</header>








<!-- ======================
 HOME
====================== -->


<section id="homeView">



<div class="hero">


<h1>
Game Guild Platform
</h1>


<p>
Создавай игровые сообщества и гильдии
</p>


<button onclick="openCreateGame()">
Создать игру
</button>


</div>







<div class="content-block">


<h2>
Игры
</h2>



<input

id="gameSearch"

placeholder="Поиск игры..."

oninput="searchGames()"

>




<div id="gamesList">


</div>


</div>



</section>









<!-- ======================
 GAME
====================== -->


<section id="gameView" hidden>


<div class="content-block">


<h2 id="gameTitle">

</h2>


<p id="gameDescription">

</p>



<h3>
Гильдии
</h3>



<div id="guildsList">

</div>



<button onclick="openCreateGuild()">

Создать гильдию

</button>


</div>


</section>









<!-- ======================
 GUILD
====================== -->


<section id="guildView" hidden>


<div class="content-block">


<img

id="guildLogo"

class="guild-logo"

>



<h2 id="guildTitle">

</h2>


<p id="guildDescription">

</p>



<h3>

Фракция

</h3>


<p id="guildFaction">

</p>



<h3>

Участники

</h3>


<div id="membersList">

</div>






<div id="leaderPanel" hidden>


<h3>

Панель главы

</h3>


<button onclick="openGuildSettings()">

Настройки

</button>


</div>



</div>



</section>









<!-- ======================
 PROFILE
====================== -->


<section id="profileView" hidden>


<div class="content-block">


<h2>
Профиль
</h2>


<div id="profileInfo">

</div>



<button onclick="logout()">

Выйти

</button>


</div>


</section>









<!-- ======================
 AUTH
====================== -->


<div id="authWindow" class="modal" hidden>


<div class="modal-box">


<h2>
Вход
</h2>


<input

id="loginEmail"

placeholder="Email"

>


<input

id="loginPassword"

type="password"

placeholder="Пароль"

>


<button onclick="login()">

Войти

</button>





<hr>



<h3>
Регистрация
</h3>



<input

id="regName"

placeholder="Никнейм"

>


<input

id="regEmail"

placeholder="Email"

>


<input

id="regPassword"

type="password"

placeholder="Пароль"

>



<button onclick="register()">

Создать аккаунт

</button>




<button onclick="closeAuth()">

Закрыть

</button>



</div>


</div>









<!-- ======================
 CREATE GAME
====================== -->


<div id="createGameWindow" class="modal" hidden>


<div class="modal-box">


<h2>
Новая игра
</h2>



<input

id="gameName"

placeholder="Название"

>



<textarea

id="gameDescriptionInput"

placeholder="Описание">

</textarea>



<input

id="gameLogo"

placeholder="Ссылка на логотип"

>




<button onclick="createGame()">

Создать

</button>



<button onclick="closeCreateGame()">

Закрыть

</button>


</div>


</div>









<!-- ======================
 CREATE GUILD
====================== -->


<div id="createGuildWindow" class="modal" hidden>


<div class="modal-box">


<h2>
Новая гильдия
</h2>



<input

id="guildNameInput"

placeholder="Название"

>



<input

id="guildTagInput"

placeholder="Тег"

>



<textarea

id="guildDescriptionInput"

placeholder="Описание">

</textarea>




<button onclick="createGuild()">

Создать

</button>



<button onclick="closeCreateGuild()">

Закрыть

</button>



</div>


</div>









<!-- ======================
 SETTINGS
====================== -->


<div id="guildSettingsWindow" class="modal" hidden>


<div class="modal-box">


<h2>
Настройки гильдии
</h2>



<input

id="themeColor"

type="color"

>



<input

id="factionName"

placeholder="Фракция"

>



<input

id="factionFlag"

placeholder="URL флага"

>



<button onclick="saveGuildSettings()">

Сохранить

</button>


</div>


</div>









</div>







<div id="siteVersion">

v4.1

</div>








<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="supabase-config.js"></script>


<script src="app.js"></script>



</body>


</html>
