<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game Platform</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>


<div class="layout">


<!-- ЛЕВАЯ ПАНЕЛЬ -->

<aside class="sidebar">

<div class="logo">
GAME HUB
</div>


<button class="menu-btn" onclick="showPage('home')">
Главная
</button>


<button class="menu-btn" onclick="showPage('profile')">
Профиль
</button>


<button class="menu-btn" onclick="showPage('games')">
Игры
</button>


<button class="menu-btn" onclick="showPage('guilds')">
Гильдии
</button>


<button class="menu-btn" onclick="showPage('conference')">
Конференция
</button>


<button class="menu-btn" onclick="logout()">
Выход
</button>


</aside>





<!-- ОСНОВНОЕ ОКНО -->

<main class="content">


<section id="home" class="page active">


<h1>
Добро пожаловать в Game Platform
</h1>


<div class="news-box">

<h2>
Новости
</h2>


<div id="news">

Новости пока отсутствуют

</div>


</div>



</section>






<section id="auth" class="page">


<h2>
Авторизация
</h2>


<input id="loginEmail"
placeholder="Email">


<input id="loginPassword"
type="password"
placeholder="Пароль">


<button class="menu-btn"
onclick="login()">

Войти

</button>




<h3>
Регистрация
</h3>


<input id="regEmail"
placeholder="Email">


<input id="regPassword"
type="password"
placeholder="Пароль">


<input id="regNickname"
placeholder="Ник">


<button class="menu-btn"
onclick="register()">

Создать аккаунт

</button>



</section>








<section id="profile" class="page">


<h2>
Профиль
</h2>


<div class="profile-card">


<img id="avatar"
src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png">


<input id="avatarUrl"
placeholder="Ссылка на аватар">


<button class="menu-btn"
onclick="saveProfile()">

Сохранить

</button>


<div id="profileInfo">

</div>


</div>


</section>









<section id="games" class="page">

<h2>
Игры
</h2>


<div class="white-box">

Добавление игр будет здесь

</div>


</section>








<section id="guilds" class="page">

<h2>
Гильдии
</h2>


<div class="white-box">

Раздел гильдий

</div>


</section>








<section id="conference" class="page">


<h2>
Конференция
</h2>


<div class="chat-box">


<div id="messages">

</div>


<input id="messageInput"
placeholder="Сообщение">


<button class="menu-btn"
onclick="sendMessage()">

Отправить

</button>



</div>



</section>







</main>


</div>



<script src="app.js"></script>


</body>
</html>
