<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game Platform</title>

<link rel="stylesheet" href="assets/css/main.css">

</head>

<body>


<header class="header">

    <div class="logo">
        🎮 GAME PLATFORM
    </div>


    <nav>

        <button id="loginBtn">
            Войти
        </button>

        <button id="registerBtn">
            Регистрация
        </button>


        <button id="profileBtn" hidden>
            Профиль
        </button>


        <button id="logoutBtn" hidden>
            Выйти
        </button>

    </nav>

</header>



<main>


<section class="hero">

<h1>
Игровая платформа
</h1>

<p>
Игры • Гильдии • Сообщества • Конференции
</p>


<div class="actions">


<button id="addGameBtn">
➕ Добавить игру
</button>


<button id="searchGameBtn">
🔎 Поиск игр
</button>


</div>


</section>



<section id="content">

</section>



</main>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase/config.js"></script>

<script src="assets/js/main.js"></script>


</body>
</html>
