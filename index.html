<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game Platform</title>


<link rel="stylesheet" href="style.css">


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


</head>


<body>


<div class="app">


<!-- =========================
     ЛЕВАЯ ПАНЕЛЬ
========================= -->

<aside class="sidebar">


<div class="logo">

GAME PLATFORM

</div>



<div class="menu">


<button class="menu-btn"
onclick="openPage('home')">

🏠 Главная

</button>


<button class="menu-btn"
onclick="openPage('auth')">

🔐 Вход

</button>



<button class="menu-btn"
onclick="openPage('profile')">

👤 Профиль

</button>



<button class="menu-btn"
onclick="openPage('games')">

🎮 Игры

</button>



<button class="menu-btn"
onclick="openPage('guilds')">

⚔ Гильдии

</button>



<button class="menu-btn"
onclick="openPage('chat')">

💬 Чат

</button>



<button class="menu-btn"
onclick="openPage('conference')">

📢 Конференция

</button>



<button class="menu-btn"
onclick="openPage('admin')">

⚙ Админ

</button>


</div>



</aside>






<!-- =========================
     ОСНОВНОЙ ЭКРАН
========================= -->


<main class="content">





<!-- =========================
     ГЛАВНАЯ
========================= -->


<section id="home"
class="page">


<h1>
Game Platform
</h1>



<div class="news-panel">


<h2>
Новости и важная информация
</h2>



<div id="newsContent">


Добро пожаловать!


<br><br>


Здесь будут отображаться новости,
объявления и важная информация.


</div>



</div>


</section>





<!-- =========================
     АВТОРИЗАЦИЯ
========================= -->


<section id="auth"
class="page hidden">


<h1>
Авторизация
</h1>



<div class="card">


<input
id="nickname"
placeholder="Никнейм">



<input
id="email"
placeholder="Email">



<input
id="password"
type="password"
placeholder="Пароль">



<button
id="registerBtn">

Регистрация

</button>



<button
id="loginBtn">

Войти

</button>


</div>



</section>
