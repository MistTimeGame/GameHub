```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game Platform</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo">
            GAME HUB
        </div>


        <button class="menu-btn" onclick="showSection('home')">
            🏠 Главная
        </button>


        <button class="menu-btn" onclick="showSection('games')">
            🎮 Игры
        </button>


        <button class="menu-btn" onclick="showSection('guilds')">
            ⚔ Гильдии
        </button>


        <button class="menu-btn" onclick="showSection('profile')">
            👤 Профиль
        </button>


        <button class="menu-btn" onclick="showSection('conference')">
            💬 Конференция
        </button>


        <div class="sidebar-bottom">

            <button 
            id="loginBtn"
            class="menu-btn"
            onclick="showSection('auth')">
                🔐 Войти
            </button>


            <button 
            id="logoutBtn"
            class="menu-btn hidden"
            onclick="logout()">
                🚪 Выйти
            </button>

        </div>


    </aside>



    <main class="content">


        <section id="home" class="page active">

            <h1>
                Добро пожаловать в Game Platform
            </h1>

            <p>
                Игровая платформа для игроков, гильдий и сообществ.
            </p>


            <div id="userInfo">

            </div>


        </section>





        <section id="auth" class="page">

            <div class="card">

                <h2>
                    Авторизация
                </h2>


                <input 
                id="email"
                type="email"
                placeholder="Email">


                <input 
                id="password"
                type="password"
                placeholder="Пароль">


                <input 
                id="nickname"
                placeholder="Никнейм">


                <button 
                class="main-btn"
                onclick="register()">
                    Регистрация
                </button>


                <button 
                class="main-btn"
                onclick="login()">
                    Войти
                </button>


                <div id="authMessage"></div>


            </div>

        </section>







        <section id="profile" class="page">


            <div class="card">

                <h2>
                    Профиль игрока
                </h2>


                <img 
                id="avatar"
                class="avatar"
                src="https://i.imgur.com/6VBx3io.png">


                <input
                id="avatarUrl"
                placeholder="Ссылка на аватар">


                <input
                id="profileNickname"
                placeholder="Ник">


                <input
                id="city"
                placeholder="Город">


                <input
                id="age"
                type="number"
                placeholder="Возраст">


                <button
                class="main-btn"
                onclick="saveProfile()">

                    Сохранить

                </button>


            </div>


        </section>







        <section id="games" class="page">

            <div class="card">

                <h2>
                    Игры
                </h2>

                <p>
                    Здесь будет каталог игр.
                </p>

            </div>

        </section>







        <section id="guilds" class="page">


            <div class="card">

                <h2>
                    Гильдии
                </h2>


                <p>
                    Здесь будут игровые сообщества.
                </p>


            </div>


        </section>







        <section id="conference" class="page">


            <div class="card">

                <h2>
                    Конференция
                </h2>


                <p>
                    Чат будет подключен отдельным модулем позже.
                </p>


            </div>


        </section>



    </main>


</div>



<script src="app.js"></script>


</body>
</html>
```
