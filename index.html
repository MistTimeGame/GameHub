<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GamePlatform</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<div class="layout">


<!-- ЛЕВАЯ ПАНЕЛЬ -->

<aside class="sidebar">


<div class="logo">

🎮 GamePlatform

</div>



<button class="menu-btn" onclick="showAuth()">

🔐 Вход / Регистрация

</button>



<button class="menu-btn" onclick="showProfile()">

👤 Профиль

</button>



<button class="menu-btn" onclick="showGames()">

🎮 Игры

</button>



<button class="menu-btn" onclick="showGuilds()">

⚔ Гильдии

</button>



<button class="menu-btn" onclick="showConference()">

💬 Конференция

</button>



</aside>





<!-- ОСНОВНАЯ ОБЛАСТЬ -->

<section class="content">


<div id="app">


<div class="welcome">


<h1>
Добро пожаловать
</h1>


<p>
Игровая платформа для игроков и гильдий
</p>


</div>


</div>


</section>



</div>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="app.js"></script>


</body>


</html>
