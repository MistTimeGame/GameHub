<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Game Guild Platform
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div id="app">



<!-- =========================
 HEADER
========================= -->


<header class="header">


<div class="logo">

GGP

</div>



<nav>


<button onclick="showPage('home')">
Игры
</button>


<button onclick="showPage('profile')">
Профиль
</button>


<button id="adminButton" hidden onclick="showPage('admin')">
Админ
</button>


</nav>



<div id="userPanel">


<button onclick="openLogin()">
Войти
</button>


</div>



</header>









<!-- =========================
 HOME
========================= -->


<section id="homePage" class="page">


<div class="hero">


<h1>
Game Guild Platform
</h1>


<p>
Создавай игровые сообщества,
гильдии и альянсы
</p>



<button onclick="openCreateGame()">
Создать игру
</button>


</div>





<div class="block">


<h2>
Поиск игр
</h2>


<input
id="gameSearch"
placeholder="Введите название игры..."
oninput="searchGames()"
>



<div id="gamesList">

</div>


</div>



</section>









<!-- =========================
 GAME PAGE
========================= -->


<section id="gamePage" class="page" hidden>



<div class="game-header">


<img id="gameLogo">



<div>


<h1 id="gameTitle">

</h1>


<p id="gameDescription">

</p>


</div>


</div>





<button onclick="openCreateGuild()">
Создать гильдию
</button>



<h2>
Гильдии
</h2>


<div id="guildList">

</div>



</section>









<!-- =========================
 GUILD PAGE
========================= -->


<section id="guildPage" class="page" hidden>


<div class="guild-cover">


<img id="guildLogo">


<h1 id="guildTitle">

</h1>


</div>



<div class="block">


<p id="guildDescription">

</p>


<p>
Фракция:
<span id="guildFaction"></span>
</p>


<button onclick="joinGuild()">
Вступить
</button>


</div>







<div class="block">


<h2>
Участники
</h2>


<div id="membersList">

</div>


</div>







<div id="guildControl" hidden>


<div class="block">


<h2>
Управление гильдией
</h2>


<button onclick="openGuildSettings()">
Настройки
</button>


<button onclick="openGuildMembers()">
Участники
</button>


</div>


</div>



</section>









<!-- =========================
 PROFILE
========================= -->


<section id="profilePage" class="page" hidden>



<div class="block">


<h1>
Профиль
</h1>


<img id="avatar">


<h2 id="profileName">

</h2>


<p id="profileEmail">

</p>



<h3>
Мои игры
</h3>


<div id="myGames">

</div>




<h3>
Мои гильдии
</h3>


<div id="myGuilds">

</div>




<button onclick="logout()">
Выйти
</button>


</div>



</section>









<!-- =========================
 ADMIN PANEL
========================= -->


<section id="adminPage" class="page" hidden>


<div class="block">


<h1>
Администрация
</h1>



<h2>
Пользователи
</h2>


<div id="adminUsers">

</div>





<h2>
Игры
</h2>


<div id="adminGames">

</div>





<h2>
Гильдии
</h2>


<div id="adminGuilds">

</div>



</div>


</section>









<!-- =========================
 LOGIN WINDOW
========================= -->


<div id="loginModal" class="modal" hidden>


<div class="modal-box">


<h2>
Вход
</h2>


<input
id="loginEmail"
placeholder="Email"
>


<input
id="loginPassword"
type="password"
placeholder="Пароль"
>


<button onclick="login()">
Войти
</button>




<hr>



<h3>
Регистрация
</h3>



<input
id="registerName"
placeholder="Никнейм"
>



<input
id="registerEmail"
placeholder="Email"
>



<input
id="registerPassword"
type="password"
placeholder="Пароль"
>



<button onclick="register()">
Создать аккаунт
</button>




<button onclick="closeLogin()">
Закрыть
</button>



</div>


</div>









<!-- =========================
 CREATE GAME
========================= -->


<div id="createGameModal" class="modal" hidden>


<div class="modal-box">


<h2>
Новая игра
</h2>


<input
id="newGameName"
placeholder="Название"
>


<textarea
id="newGameDescription"
placeholder="Описание">
</textarea>


<input
id="newGameLogo"
placeholder="Логотип">
</input>


<button onclick="createGame()">
Создать
</button>


<button onclick="closeCreateGame()">
Закрыть
</button>


</div>


</div>









<!-- =========================
 CREATE GUILD
========================= -->


<div id="createGuildModal" class="modal" hidden>


<div class="modal-box">


<h2>
Новая гильдия
</h2>


<input
id="newGuildName"
placeholder="Название"
>


<input
id="newGuildTag"
placeholder="Тег"
>


<textarea
id="newGuildDescription"
placeholder="Описание">
</textarea>



<button onclick="createGuild()">
Создать
</button>


<button onclick="closeCreateGuild()">
Закрыть
</button>



</div>

</div>









</div>





<div id="version">
GGP v5.0
</div>







<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="app.js"></script>



</body>

</html>
