<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GamePlatform</title>


<link rel="stylesheet" href="style.css">


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


</head>


<body>



<div class="layout">



<!-- =====================
     LEFT PANEL
===================== -->

<aside class="sidebar">


<div class="logo">

GAME PLATFORM

</div>



<button class="menu-btn"
onclick="showBlock('auth')">

🔐 Вход

</button>



<button class="menu-btn"
onclick="showBlock('profile')">

👤 Профиль

</button>



<button class="menu-btn"
onclick="showBlock('games')">

🎮 Игры

</button>



<button class="menu-btn"
onclick="showBlock('guilds')">

⚔ Гильдии

</button>



<button class="menu-btn"
onclick="showBlock('chat')">

💬 Чат

</button>



<button class="menu-btn"
onclick="showBlock('conference')">

📢 Конференция

</button>



</aside>







<!-- =====================
     MAIN
===================== -->


<main class="content">





<!-- AUTH -->

<section id="auth"
class="page">


<h1>
Авторизация
</h1>



<input 
id="nickname"
placeholder="Никнейм">


<input
id="email"
placeholder="Email">


<input
id="password"
type="password"
placeholder="Пароль">



<div class="buttons">


<button
id="registerBtn">

Регистрация

</button>


<button
id="loginBtn">

Войти

</button>


</div>


</section>








<!-- PROFILE -->


<section id="profile"
class="page hidden">


<h1>
Профиль
</h1>



<div id="profileBox">


Войдите в аккаунт


</div>



<hr>



<input
id="avatar"
placeholder="Ссылка на аватар">



<input
id="city"
placeholder="Город">



<input
id="age"
type="number"
placeholder="Возраст">



<button
id="saveProfileBtn">

Сохранить профиль

</button>



</section>









<!-- GAMES -->


<section id="games"
class="page hidden">


<h1>
Игры
</h1>


<div class="card">

Поиск игр

<br><br>

<button>

Добавить игру

</button>


</div>


</section>









<!-- GUILDS -->


<section id="guilds"
class="page hidden">


<h1>
Гильдии
</h1>



<div class="card">


Создание и управление гильдиями


</div>



</section>









<!-- CHAT -->


<section id="chat"
class="page hidden">


<h1>
Общий чат
</h1>



<div id="chatMessages"
class="messages">

</div>




<div class="chat-input">


<input
id="messageInput"
placeholder="Сообщение">


<button
id="sendMessageBtn">

Отправить

</button>


</div>



</section>









<!-- CONFERENCE -->


<section id="conference"
class="page hidden">


<h1>
Конференция
</h1>




<div id="conferenceMessages"
class="messages">

</div>




<div class="chat-input">


<input
id="conferenceInput"
placeholder="Сообщение">


<button
id="sendConferenceBtn">

Отправить

</button>



</div>



</section>







</main>


</div>







<script src="app.js"></script>



<script>


function showBlock(id){


document
.querySelectorAll(".page")
.forEach(
p=>p.classList.add("hidden")
);



let block =
document.getElementById(id);



if(block)
block.classList.remove("hidden");



}



</script>




</body>

</html>
