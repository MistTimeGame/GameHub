<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
GGP Universe
</title>


<link rel="stylesheet" href="style.css">


<link href="
https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap
"
rel="stylesheet">


</head>


<body>



<div id="universe">



<!-- 3D BACKGROUND -->

<div id="space"></div>

<div id="particles"></div>





<!-- HEADER -->

<header class="top-bar">


<div class="brand">


<div class="brand-symbol">

GGP

</div>


<div>

<h1>
Game Guild Platform
</h1>


<span>
Gaming Universe
</span>


</div>


</div>





<nav>


<button onclick="showPage('home')">
Universe
</button>


<button onclick="showPage('profile')">
Profile
</button>


<button 
id="adminButton"
hidden
onclick="showPage('admin')">
Admin
</button>


</nav>




<div id="userPanel">


<button onclick="openLogin()">

LOGIN

</button>


</div>



</header>









<!-- MAIN -->

<main>





<!-- HOME -->


<section id="homePage" class="page">



<div class="hero-3d">



<div class="hero-content">


<h1>

CREATE YOUR

<br>

GAMING EMPIRE

</h1>



<p>

Создавай игры.
Строй гильдии.
Объединяй игроков.

</p>



<div class="hero-buttons">


<button onclick="openCreateGame()">

CREATE GAME

</button>


<button>

EXPLORE

</button>



</div>



</div>





<div class="planet">


<div class="planet-core">

</div>


</div>



</div>









<section class="glass-panel">


<h2>

GAME DATABASE

</h2>



<div class="search-box">


<input
id="gameSearch"
placeholder="Search universe..."
oninput="searchGames()"
>



</div>





<div id="gamesList">


</div>



</section>



</section>













<!-- GAME PAGE -->

<section 
id="gamePage"
class="page"
hidden>



<div class="game-cover">


<img id="gameLogo">


<div>


<h1 id="gameTitle">

</h1>


<p id="gameDescription">

</p>


</div>



</div>






<div class="stats-panel">


<div>

<h2>
0
</h2>

<span>
Guilds
</span>

</div>


<div>

<h2>
0
</h2>

<span>
Players
</span>

</div>



<div>

<h2>
0
</h2>

<span>
Online
</span>

</div>


</div>






<button onclick="openCreateGuild()">

CREATE GUILD

</button>




<div id="guildList">


</div>



</section>












<!-- GUILD PAGE -->


<section
id="guildPage"
class="page"
hidden>


<div class="guild-hero">



<img id="guildLogo">


<h1 id="guildTitle">

</h1>


<div class="faction">

<span>
Faction:
</span>

<b id="guildFaction">

</b>

</div>



</div>






<div class="glass-panel">


<p id="guildDescription">

</p>


<button onclick="joinGuild()">

JOIN GUILD

</button>



</div>







<div class="glass-panel">


<h2>

Members

</h2>



<div id="membersList">

</div>


</div>







<div id="guildControl"
hidden
class="glass-panel">


<h2>

Guild Control

</h2>


<button onclick="openGuildSettings()">

Settings

</button>


</div>




</section>












<!-- PROFILE -->


<section
id="profilePage"
class="page"
hidden>



<div class="profile-card">


<img id="avatar">


<h1 id="profileName">

</h1>


<p id="profileEmail">

</p>




<h2>

My Games

</h2>


<div id="myGames">

</div>



<h2>

My Guilds

</h2>


<div id="myGuilds">

</div>



<button onclick="logout()">

LOGOUT

</button>



</div>



</section>









<!-- ADMIN -->


<section
id="adminPage"
class="page"
hidden>


<div class="glass-panel">


<h1>

CONTROL CENTER

</h1>



<h2>
Users
</h2>


<div id="adminUsers">

</div>



<h2>
Games
</h2>


<div id="adminGames">

</div>



<h2>
Guilds
</h2>


<div id="adminGuilds">

</div>



</div>



</section>









</main>









<!-- LOGIN -->

<div id="loginModal"
class="modal"
hidden>



<div class="holo-window">


<h2>
LOGIN
</h2>



<input id="loginEmail"
placeholder="Email">



<input id="loginPassword"
type="password"
placeholder="Password">



<button onclick="login()">

ENTER

</button>



<hr>



<input id="registerName"
placeholder="Nickname">


<input id="registerEmail"
placeholder="Email">


<input id="registerPassword"
type="password"
placeholder="Password">



<button onclick="register()">

CREATE ACCOUNT

</button>



<button onclick="closeLogin()">

CLOSE

</button>


</div>



</div>









<!-- CREATE GAME -->


<div id="createGameModal"
class="modal"
hidden>



<div class="holo-window">


<h2>
NEW GAME
</h2>



<input
id="newGameName"
placeholder="Game name">


<textarea
id="newGameDescription"
placeholder="Description">
</textarea>



<input
id="newGameLogo"
placeholder="Logo URL">



<button onclick="createGame()">

CREATE

</button>



<button onclick="closeCreateGame()">

CLOSE

</button>


</div>


</div>









<!-- CREATE GUILD -->


<div id="createGuildModal"
class="modal"
hidden>


<div class="holo-window">


<h2>
NEW GUILD
</h2>


<input
id="newGuildName"
placeholder="Guild name">



<input
id="newGuildTag"
placeholder="TAG">



<textarea
id="newGuildDescription"
placeholder="Description">
</textarea>



<button onclick="createGuild()">

CREATE

</button>


<button onclick="closeCreateGuild()">

CLOSE

</button>



</div>


</div>









</div>






<script src="
https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2
"></script>


<script src="supabase-config.js"></script>


<script src="app.js"></script>


</body>


</html>
