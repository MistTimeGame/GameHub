<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Game Guild Platform
</title>


<link rel="stylesheet" href="style.css">


</head>


<body>



<div id="app">





<!-- =========================
HEADER
========================= -->


<header class="top-header">


<div class="logo">

GGP

</div>



<nav>


<button onclick="showHome()">

Игры

</button>


<button onclick="showGuilds()">

Гильдии

</button>


<button onclick="showProfile()">

Профиль

</button>


</nav>





<div id="authBlock">


<button onclick="openAuth()">

Войти

</button>


</div>



</header>









<!-- =========================
HOME
========================= -->


<section id="homeView">



<div class="hero">



<div class="hero-content">


<h1>

Создавай игровые сообщества

</h1>


<p>

Игры.
Гильдии.
Альянсы.
Свои миры.

</p>



<div class="hero-buttons">


<button onclick="openCreateGame()">

Создать игру

</button>



<button onclick="showGames()">

Найти игру

</button>


</div>


</div>


</div>







<section class="content-block">


<h2>

Игры

</h2>



<div class="search-line">


<input

id="gameSearch"

placeholder="Поиск игры..."

oninput="searchGames()"

>


</div>






<div id="gamesList"

class="cards">


</div>



</section>



</section>









<!-- =========================
GAME VIEW
========================= -->


<section

id="gameView"

hidden>



<div class="game-banner">


<img

id="currentGameLogo"

>


<h1 id="currentGameName">

</h1>


<p id="currentGameDescription">

</p>


</div>





<section class="content-block">


<h2>

Гильдии

</h2>



<div id="guildsList"

class="cards">


</div>




<button onclick="openCreateGuild()">

Создать гильдию

</button>



</section>




</section>









<!-- =========================
GUILD VIEW
========================= -->


<section

id="guildView"

hidden>



<div

id="guildBanner"

class="guild-banner">





<div>


<img

id="guildLogo"

class="guild-logo"

>



<h1

id="guildName">

</h1>



<p

id="guildFaction">

</p>



</div>


</div>







<section class="content-block">


<h2>

Описание

</h2>


<p id="guildDescription">

</p>



</section>








<section class="content-block">


<h2>

Участники

</h2>



<div id="membersList">


</div>


</section>








<section

id="leaderPanel"

class="content-block"

hidden>



<h2>

Панель главы

</h2>



<button onclick="openGuildSettings()">

🎨 Оформление

</button>


<button>

👥 Управление участниками

</button>


</section>





</section>









<!-- =========================
PROFILE
========================= -->


<section

id="profileView"

hidden>



<section class="content-block">


<h2>

Профиль

</h2>



<div id="profileInfo">


</div>



</section>


</section>









<!-- =========================
AUTH WINDOW
========================= -->


<div

id="authWindow"

class="modal"

hidden>


<div class="modal-box">



<h2>

Авторизация

</h2>



<input

id="loginEmail"

placeholder="Email"

>


<input

id="loginPassword"

type="password"

placeholder="Пароль"

>



<button onclick="login()">

Войти

</button>





<hr>





<h3>

Регистрация

</h3>



<input

id="regName"

placeholder="Никнейм"

>


<input

id="regEmail"

placeholder="Email"

>


<input

id="regPassword"

type="password"

placeholder="Пароль"

>



<button onclick="register()">

Создать аккаунт

</button>





<button onclick="closeAuth()">

Закрыть

</button>



</div>


</div>









<!-- =========================
CREATE GAME
========================= -->


<div

id="createGameWindow"

class="modal"

hidden>



<div class="modal-box">


<h2>

Новая игра

</h2>



<input

id="gameName"

placeholder="Название игры"

>



<textarea

id="gameDescription"

placeholder="Описание">

</textarea>



<input

id="gameLogo"

placeholder="Ссылка на логотип"

>



<button onclick="createGame()">

Создать

</button>



<button onclick="closeCreateGame()">

Закрыть

</button>


</div>


</div>









<!-- =========================
CREATE GUILD
========================= -->


<div

id="createGuildWindow"

class="modal"

hidden>



<div class="modal-box">


<h2>

Новая гильдия

</h2>



<input

id="guildNameInput"

placeholder="Название"

>



<input

id="guildTagInput"

placeholder="Тег"

>




<textarea

id="guildDescriptionInput"

placeholder="Описание">

</textarea>





<button onclick="createGuild()">

Создать

</button>



<button onclick="closeCreateGuild()">

Закрыть

</button>



</div>


</div>









<!-- =========================
GUILD SETTINGS
========================= -->


<div

id="guildSettingsWindow"

class="modal"

hidden>



<div class="modal-box">


<h2>

Настройки гильдии

</h2>



<label>

Цвет темы

</label>


<input

id="themeColor"

type="color"

>





<label>

Цвет кнопок

</label>


<input

id="buttonColor"

type="color"

>






<input

id="backgroundUrl"

placeholder="Фон страницы"

>




<input

id="factionName"

placeholder="Фракция"

>




<input

id="factionFlag"

placeholder="Флаг фракции"

>






<button onclick="saveGuildSettings()">

Сохранить

</button>



</div>


</div>









</div>







<div id="siteVersion">

v4.0

</div>









<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="supabase-config.js"></script>


<script src="version.js"></script>


<script src="app.js"></script>



</body>


</html>
