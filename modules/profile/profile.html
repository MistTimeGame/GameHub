<div class="profile-card">

    <div class="profile-header">
        <img id="profile-avatar"
             src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png">

        <div>
            <h2 id="profile-nickname">
                Гость
            </h2>

            <div id="profile-vip">
                VIP I
            </div>
        </div>
    </div>


    <div class="profile-form">

        <label>
            Никнейм
        </label>

        <input id="nickname"
               placeholder="Введите ник">


        <label>
            Возраст
        </label>

        <input id="age"
               type="number"
               placeholder="Возраст">


        <label>
            Город
        </label>

        <input id="city"
               placeholder="Город">


        <label>
            Ссылка на аватар
        </label>

        <input id="avatar"
               placeholder="URL изображения">


        <button id="save-profile">
            Сохранить профиль
        </button>


    </div>


</div>
