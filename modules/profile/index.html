<div class="profile-card">


<div class="profile-avatar-box">

<img 
id="profile-avatar"
src="assets/avatar-droid.gif"
>


</div>



<h2>
Мой профиль
</h2>



<div class="vip-badge">

VIP 
<span id="vip-level">
I
</span>

</div>



<label>
Никнейм
</label>

<input
id="profile-nickname"
placeholder="Ваш ник"
>



<label>
Город
</label>

<input
id="profile-city"
placeholder="Город"
>



<label>
Возраст
</label>

<input
id="profile-age"
type="number"
placeholder="Возраст"
>



<label>
Аватар URL
</label>


<input
id="profile-avatar-url"
placeholder="Ссылка на изображение"
>



<button id="save-profile">
Сохранить
</button>


</div>
