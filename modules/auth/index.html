<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
GameHub Авторизация
</title>


<link
rel="stylesheet"
href="../core/core.css"
>


<link
rel="stylesheet"
href="./auth.css"
>


</head>


<body>


<div class="auth-page">


<div class="auth-box gh-card">


<div class="auth-title">

<h1>
GameHub
</h1>

<p>
Игровая платформа
</p>

</div>



<div class="auth-tabs">


<button
id="show-login"
class="gh-button"
>
Вход
</button>



<button
id="show-register"
class="gh-button secondary"
>
Регистрация
</button>


</div>





<form
id="login-form"
class="auth-form"
>


<input
id="login-email"
class="gh-input"
type="email"
placeholder="Email"
required
>


<input
id="login-password"
class="gh-input"
type="password"
placeholder="Пароль"
required
>


<button
class="gh-button"
>
Войти
</button>


</form>






<form
id="register-form"
class="auth-form gh-hidden"
>


<input
id="register-email"
class="gh-input"
type="email"
placeholder="Email"
required
>


<input
id="register-password"
class="gh-input"
type="password"
placeholder="Пароль"
minlength="6"
placeholder="Минимум 6 символов"
required
>


<input
id="register-nickname"
class="gh-input"
type="text"
placeholder="Игровой ник"
required
>



<button
class="gh-button"
>
Создать аккаунт
</button>


</form>




<div
id="auth-message"
class="auth-message"
></div>




<div class="auth-footer">

После регистрации будет создан профиль игрока.

</div>



</div>


</div>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="../core/supabase.js"></script>

<script src="../core/session.js"></script>

<script src="../core/router.js"></script>


<script src="./auth.js"></script>



</body>

</html>
