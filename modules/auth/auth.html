<div class="auth-box">


<h2>
Авторизация
</h2>



<input 
id="auth-email"
placeholder="Email">



<input
id="auth-password"
type="password"
placeholder="Пароль">



<input
id="auth-nickname"
placeholder="Никнейм">



<div class="auth-buttons">


<button id="do-login">
Войти
</button>



<button id="do-register">
Регистрация
</button>



</div>



</div>
