<div class="auth-box">


<h2>
🎮 Авторизация
</h2>



<div class="tabs">

<button id="showLogin">
Вход
</button>


<button id="showRegister">
Регистрация
</button>

</div>



<div id="loginForm">


<input
id="loginEmail"
type="email"
placeholder="Email"
>


<input
id="loginPassword"
type="password"
placeholder="Пароль"
>


<button id="loginSubmit">
Войти
</button>


</div>





<div id="registerForm"
style="display:none">


<input
id="regNickname"
placeholder="Никнейм"
>


<input
id="regEmail"
type="email"
placeholder="Email"
>


<input
id="regPassword"
type="password"
placeholder="Пароль"
>


<button id="registerSubmit">
Создать аккаунт
</button>


</div>



<div id="authMessage">

</div>


</div>


<link rel="stylesheet" href="modules/auth/auth.css">

<script src="modules/auth/auth.js"></script>
