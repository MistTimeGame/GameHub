<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Гильдия — GameHub</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .page {
            min-height: 100vh;
        }

        /* =========================
           LOADING
        ========================= */

        #loading-screen {
            position: fixed;
            inset: 0;
            background: #f4f6f8;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        #loading-screen.hidden {
            display: none;
        }

        .loading-box {
            background: white;
            padding: 30px 40px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
            text-align: center;
            min-width: 260px;
        }

        .spinner {
            width: 42px;
            height: 42px;
            margin: 0 auto 18px;
            border: 4px solid #e5e7eb;
            border-top-color: #2674e8;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 16px;
            color: #555;
        }

        /* =========================
           HEADER
        ========================= */

        .topbar {
            height: 64px;
            background: white;
            border-bottom: 1px solid #e4e7eb;
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-button {
            border: 0;
            background: #eef3f8;
            color: #2674e8;
            border-radius: 12px;
            padding: 10px 15px;
            font-weight: 600;
        }

        .back-button:hover {
            background: #e2ebf5;
        }

        .top-title {
            font-size: 19px;
            font-weight: 700;
            flex: 1;
        }

        .user-name {
            color: #666;
            font-size: 14px;
        }

        .logout-button {
            border: 0;
            background: #f0f2f5;
            border-radius: 10px;
            padding: 9px 14px;
            cursor: pointer;
        }

        /* =========================
           MAIN
        ========================= */

        .container {
            max-width: 1250px;
            margin: 0 auto;
            padding: 24px;
        }

        /* =========================
           ERROR
        ========================= */

        .error-box {
            background: #fff;
            border: 1px solid #f0caca;
            color: #a33;
            border-radius: 16px;
            padding: 25px;
            margin-top: 25px;
        }

        .error-box h2 {
            margin-top: 0;
        }

        .error-box button {
            margin-top: 15px;
            border: 0;
            border-radius: 10px;
            background: #2674e8;
            color: white;
            padding: 11px 18px;
        }

        /* =========================
           GUILD HERO
        ========================= */

        .guild-hero {
            background: white;
            border-radius: 22px;
            padding: 28px;
            display: flex;
            gap: 24px;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0,0,0,.05);
            margin-bottom: 20px;
        }

        .guild-logo {
            width: 110px;
            height: 110px;
            border-radius: 22px;
            background: #edf1f5;
            object-fit: cover;
            flex-shrink: 0;
        }

        .guild-logo-placeholder {
            width: 110px;
            height: 110px;
            border-radius: 22px;
            background: linear-gradient(135deg, #2674e8, #65a0ff);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .guild-info {
            min-width: 0;
            flex: 1;
        }

        .guild-name {
            margin: 0 0 7px;
            font-size: 32px;
        }

        .guild-tag {
            display: inline-block;
            background: #eef3f8;
            color: #2674e8;
            border-radius: 8px;
            padding: 4px 9px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .guild-description {
            margin: 0;
            color: #666;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .guild-meta {
            margin-top: 12px;
            color: #888;
            font-size: 13px;
        }

        .role-badge {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 10px;
            border-radius: 9px;
            background: #eaf7ee;
            color: #258343;
            font-size: 13px;
            font-weight: 700;
        }

        /* =========================
           NAVIGATION
        ========================= */

        .guild-nav {
            background: white;
            border-radius: 16px;
            padding: 8px;
            display: flex;
            gap: 5px;
            overflow-x: auto;
            box-shadow: 0 5px 20px rgba(0,0,0,.04);
            margin-bottom: 20px;
        }

        .guild-nav button {
            border: 0;
            background: transparent;
            color: #555;
            border-radius: 11px;
            padding: 11px 17px;
            white-space: nowrap;
            font-weight: 600;
        }

        .guild-nav button:hover {
            background: #f0f3f6;
        }

        .guild-nav button.active {
            background: #2674e8;
            color: white;
        }

        /* =========================
           CONTENT
        ========================= */

        .content-card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,.04);
        }

        .content-card h2 {
            margin-top: 0;
        }

        .section-description {
            color: #777;
            line-height: 1.5;
        }

        .empty {
            padding: 35px 20px;
            text-align: center;
            color: #888;
        }

        /* =========================
           MEMBERS
        ========================= */

        .members-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 12px;
        }

        .member-card {
            border: 1px solid #e8ebef;
            border-radius: 14px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .member-avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #edf1f5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2674e8;
            font-weight: 700;
            flex-shrink: 0;
        }

        .member-name {
            font-weight: 700;
        }

        .member-role {
            margin-top: 4px;
            font-size: 12px;
            color: #888;
        }

        /* =========================
           NEWS
        ========================= */

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .news-card {
            border: 1px solid #e8ebef;
            border-radius: 15px;
            padding: 18px;
        }

        .news-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .news-date {
            font-size: 12px;
            color: #999;
            margin-bottom: 12px;
        }

        .news-content {
            color: #555;
            line-height: 1.55;
            white-space: pre-wrap;
        }

        /* =========================
           GALLERY
        ========================= */

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .gallery-card {
            border: 1px solid #e8ebef;
            border-radius: 15px;
            overflow: hidden;
            background: white;
        }

        .gallery-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #edf1f5;
        }

        .gallery-info {
            padding: 12px;
        }

        .gallery-title {
            font-weight: 700;
        }

        .gallery-description {
            color: #777;
            font-size: 13px;
            margin-top: 5px;
        }

        /* =========================
           DOCUMENTS
        ========================= */

        .documents-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .document-card {
            border: 1px solid #e8ebef;
            border-radius: 14px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .document-icon {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: #eef3f8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
        }

        .document-info {
            flex: 1;
        }

        .document-name {
            font-weight: 700;
        }

        .document-meta {
            color: #888;
            font-size: 12px;
            margin-top: 5px;
        }

        /* =========================
           RELATIONS
        ========================= */

        .relation-card {
            border: 1px solid #e8ebef;
            border-radius: 14px;
            padding: 17px;
            margin-bottom: 10px;
        }

        .relation-name {
            font-weight: 700;
        }

        .relation-status {
            font-size: 13px;
            color: #777;
            margin-top: 6px;
        }

        /* =========================
           APPLICATIONS
        ========================= */

        .application-card {
            border: 1px solid #e8ebef;
            border-radius: 14px;
            padding: 17px;
            margin-bottom: 10px;
        }

        .application-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .application-name {
            font-weight: 700;
        }

        .application-status {
            font-size: 12px;
            background: #fff3cd;
            color: #8a6900;
            padding: 5px 9px;
            border-radius: 8px;
        }

        .application-message {
            margin-top: 10px;
            color: #666;
            white-space: pre-wrap;
        }

        .application-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        .btn {
            border: 0;
            border-radius: 10px;
            padding: 10px 15px;
            font-weight: 600;
        }

        .btn-primary {
            background: #2674e8;
            color: white;
        }

        .btn-danger {
            background: #f5e8e8;
            color: #b33;
        }

        .btn-secondary {
            background: #eef1f4;
            color: #444;
        }

        /* =========================
           EDIT
        ========================= */

        .edit-form {
            display: grid;
            gap: 14px;
        }

        .form-group {
            display: grid;
            gap: 6px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            border: 1px solid #dce1e6;
            border-radius: 10px;
            padding: 11px 12px;
            outline: none;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #2674e8;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .checkbox-row input {
            width: auto;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* =========================
           TOAST
        ========================= */

        #toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #222;
            color: white;
            padding: 13px 17px;
            border-radius: 12px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
            transition: .2s;
            z-index: 10000;
            max-width: 400px;
        }

        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        #toast.error {
            background: #a33;
        }

        #toast.success {
            background: #27854a;
        }

        @media (max-width: 700px) {

            .topbar {
                padding: 0 12px;
            }

            .user-name {
                display: none;
            }

            .container {
                padding: 12px;
            }

            .guild-hero {
                padding: 18px;
                flex-direction: column;
                align-items: flex-start;
            }

            .guild-name {
                font-size: 26px;
            }

            .guild-nav {
                border-radius: 13px;
            }
        }
    </style>
</head>

<body>

<div id="loading-screen">
    <div class="loading-box">
        <div class="spinner"></div>
        <div class="loading-text" id="loading-text">
            Загрузка гильдии...
        </div>
    </div>
</div>

<div class="page">

    <header class="topbar">

        <button
            class="back-button"
            id="back-button"
            type="button">
            ← Назад
        </button>

        <div class="top-title" id="top-title">
            Гильдия
        </div>

        <div class="user-name" id="user-name"></div>

        <button
            class="logout-button"
            id="logout-button"
            type="button">
            Выйти
        </button>

    </header>

    <main class="container">

        <div id="error-container"></div>

        <section
            class="guild-hero"
            id="guild-hero"
            style="display:none;">

            <div id="guild-logo-container"></div>

            <div class="guild-info">

                <h1
                    class="guild-name"
                    id="guild-name">
                </h1>

                <div
                    class="guild-tag"
                    id="guild-tag"
                    style="display:none;">
                </div>

                <p
                    class="guild-description"
                    id="guild-description">
                </p>

                <div
                    class="guild-meta"
                    id="guild-meta">
                </div>

                <div
                    class="role-badge"
                    id="role-badge"
                    style="display:none;">
                </div>

            </div>

        </section>

        <nav
            class="guild-nav"
            id="guild-nav"
            style="display:none;">

            <button
                type="button"
                class="active"
                data-section="about">
                О нас
            </button>

            <button
                type="button"
                data-section="news">
                Новости
            </button>

            <button
                type="button"
                data-section="members">
                Участники
            </button>

            <button
                type="button"
                data-section="gallery">
                Галерея
            </button>

            <button
                type="button"
                data-section="documents">
                Документы
            </button>

            <button
                type="button"
                data-section="diplomacy">
                Дипломатия
            </button>

            <button
                type="button"
                data-section="applications"
                id="applications-tab"
                style="display:none;">
                Заявки
            </button>

            <button
                type="button"
                data-section="edit"
                id="edit-tab"
                style="display:none;">
                Управление
            </button>

        </nav>

        <section
            class="content-card"
            id="content">
        </section>

    </main>

</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
"use strict";

/* =========================================================
   SUPABASE
========================================================= */

let supabaseClient = null;

if (
    typeof window.SUPABASE_URL !== "string" ||
    typeof window.SUPABASE_ANON_KEY !== "string" ||
    !window.SUPABASE_URL ||
    !window.SUPABASE_ANON_KEY
) {
    showFatalError("Не найден supabase-config.js или настройки Supabase.");
} else {
    supabaseClient = window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_ANON_KEY
    );
}


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let currentProfile = null;
let guild = null;
let game = null;
let currentMembership = null;

const guildId =
    new URLSearchParams(window.location.search).get("id");


/* =========================================================
   DOM
========================================================= */

const loadingScreen =
    document.getElementById("loading-screen");

const loadingText =
    document.getElementById("loading-text");

const errorContainer =
    document.getElementById("error-container");

const guildHero =
    document.getElementById("guild-hero");

const guildNav =
    document.getElementById("guild-nav");

const content =
    document.getElementById("content");

const userNameElement =
    document.getElementById("user-name");

const toast =
    document.getElementById("toast");


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function formatDate(value) {

    if (!value) {
        return "—";
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return "—";
    }

    return date.toLocaleDateString("ru-RU", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
    });
}


function initials(name) {

    if (!name) {
        return "?";
    }

    const parts = String(name)
        .trim()
        .split(/\s+/)
        .filter(Boolean);

    if (parts.length === 1) {
        return parts[0].substring(0, 2).toUpperCase();
    }

    return (
        parts[0].charAt(0) +
        parts[1].charAt(0)
    ).toUpperCase();
}


function showToast(message, type = "") {

    toast.textContent = message;

    toast.className = "";

    toast.classList.add("show");

    if (type) {
        toast.classList.add(type);
    }

    setTimeout(() => {
        toast.classList.remove("show");
    }, 3500);
}


function setLoading(message) {

    if (loadingText) {
        loadingText.textContent =
            message || "Загрузка...";
    }

    loadingScreen.classList.remove("hidden");
}


function hideLoading() {

    loadingScreen.classList.add("hidden");
}


function showFatalError(message) {

    hideLoading();

    errorContainer.innerHTML = `
        <div class="error-box">
            <h2>Не удалось открыть гильдию</h2>
            <p>${escapeHtml(message)}</p>

            <button
                type="button"
                onclick="location.href='index.html'">
                Вернуться на главную
            </button>
        </div>
    `;
}


function showSectionError(message) {

    content.innerHTML = `
        <div class="error-box">
            <h2>Не удалось загрузить раздел</h2>
            <p>${escapeHtml(message)}</p>
        </div>
    `;
}


/* =========================================================
   AUTH
========================================================= */

async function loadUser() {

    if (!supabaseClient) {
        throw new Error("Supabase не инициализирован.");
    }

    const {
        data,
        error
    } = await supabaseClient.auth.getUser();

    if (error) {
        throw error;
    }

    currentUser = data.user;

    if (!currentUser) {
        location.href = "index.html";
        return false;
    }

    return true;
}


/* =========================================================
   PROFILE
========================================================= */

async function loadProfile() {

    const {
        data,
        error
    } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .maybeSingle();

    if (error) {
        console.warn("Профиль не загрузился:", error);
        return;
    }

    currentProfile = data;

    userNameElement.textContent =
        data?.display_name ||
        data?.username ||
        currentUser.email ||
        "";
}


/* =========================================================
   GUILD
========================================================= */

async function loadGuild() {

    if (!guildId) {
        throw new Error(
            "В адресе страницы отсутствует ID гильдии."
        );
    }

    const {
        data,
        error
    } = await supabaseClient
        .from("guilds")
        .select("*")
        .eq("id", guildId)
        .maybeSingle();

    if (error) {
        throw error;
    }

    if (!data) {
        throw new Error(
            "Гильдия не найдена или у вас нет доступа к ней."
        );
    }

    guild = data;

    document.title =
        guild.name + " — GameHub";
}


/* =========================================================
   GAME
========================================================= */

async function loadGame() {

    if (!guild?.game_id) {
        return;
    }

    const {
        data,
        error
    } = await supabaseClient
        .from("games")
        .select("*")
        .eq("id", guild.game_id)
        .maybeSingle();

    if (error) {
        console.warn(
            "Игра не загрузилась:",
            error
        );

        return;
    }

    game = data;
}


/* =========================================================
   CURRENT MEMBERSHIP
========================================================= */

async function loadMembership() {

    const {
        data,
        error
    } = await supabaseClient
        .from("guild_members")
        .select("*")
        .eq("guild_id", guildId)
        .eq("user_id", currentUser.id)
        .is("left_at", null)
        .maybeSingle();

    if (error) {

        console.warn(
            "Не удалось определить членство:",
            error
        );

        currentMembership = null;

        return;
    }

    currentMembership = data;
}


/* =========================================================
   RENDER HERO
========================================================= */

function renderGuildHero() {

    document.getElementById("top-title").textContent =
        guild.name;

    document.getElementById("guild-name").textContent =
        guild.name;

    const tag =
        document.getElementById("guild-tag");

    if (guild.tag) {
        tag.textContent =
            "[" + guild.tag + "]";

        tag.style.display = "inline-block";
    } else {
        tag.style.display = "none";
    }

    document.getElementById("guild-description")
        .textContent =
        guild.description ||
        "Описание гильдии пока не добавлено.";

    document.getElementById("guild-meta")
        .textContent =
        "Создана: " +
        formatDate(guild.created_at);

    const logoContainer =
        document.getElementById(
            "guild-logo-container"
        );

    if (guild.logo_url) {

        logoContainer.innerHTML = `
            <img
                class="guild-logo"
                src="${escapeHtml(guild.logo_url)}"
                alt="${escapeHtml(guild.name)}"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
            >

            <div
                class="guild-logo-placeholder"
                style="display:none;">
                ${escapeHtml(initials(guild.name))}
            </div>
        `;

    } else {

        logoContainer.innerHTML = `
            <div class="guild-logo-placeholder">
                ${escapeHtml(initials(guild.name))}
            </div>
        `;
    }

    const roleBadge =
        document.getElementById("role-badge");

    if (currentMembership) {

        const roleNames = {
            member: "Участник",
            officer: "Офицер",
            diplomat: "Дипломат",
            leader: "Лидер"
        };

        roleBadge.textContent =
            roleNames[currentMembership.role] ||
            currentMembership.role;

        roleBadge.style.display =
            "inline-block";

    } else {

        roleBadge.style.display =
            "none";
    }

    guildHero.style.display = "flex";
    guildNav.style.display = "flex";
}

function openApplicationForm() {

    }

    container.innerHTML = `
        <div

                </div>

                <div class="form-group">
                    <label for="application-message">

                    </label>

                </div>

                    </button>

}


async function submitApplication() {

    const nickname =
        document.getElementById(
            "application-nickname"
        )?.value.trim();

    const message =
        document.getElementById(
            "application-message"
        )?.value.trim();

    if (!nickname) {

        showToast(
            "Введите игровой ник.",
            "error"
        );

        return;
    }

    try {

        const {
            error
        } = await supabaseClient
            .from("guild_applications")
            .insert({
                guild_id: guild.id,
                game_id: guild.game_id,
                user_id: currentUser.id,
                nickname,
                message: message || "",
                status: "pending"
            });

        if (error) {
            throw error;
        }

        showToast(
            "Заявка отправлена.",
            "success"
        );

        renderAbout();

    } catch (error) {

        console.error(error);

        showToast(
            error.message ||
            "Не удалось отправить заявку.",
            "error"
        );
    }
}

        .from("guild_members")
        .select("*")
        .eq("guild_id", guildId)
        .is("left_at", null)
        .order("role", {

        });

    if (error) {

        showSectionError(
            "Не удалось загрузить участников: " +

        content.innerHTML = `

/* =========================================================
   DIPLOMACY
========================================================= */

async function renderDiplomacy() {

    content.innerHTML = `
        <h2>Дипломатия</h2>

        <div class="empty">
            Загрузка дипломатии...
        </div>
    `;

    const {
        data,
        error
    } = await supabaseClient
        .from("guild_relations")
        .select("*")
        .eq("game_id", guild.game_id)
        .or(
            "guild_a_id.eq." +
            guild.id +
            ",guild_b_id.eq." +
            guild.id
        )
        .order("created_at", {
            ascending: false
        });

    if (error) {

        showSectionError(
            "Не удалось загрузить дипломатию: " +
            error.message
        );

        return;
    }

    if (!data || data.length === 0) {

        content.innerHTML = `
            <h2>Дипломатия</h2>

            <div class="empty">
                У гильдии пока нет дипломатических отношений.
            </div>
        `;

        return;
    }

    const otherGuildIds = data.map(relation => {

        if (relation.guild_a_id === guild.id) {
            return relation.guild_b_id;
        }

        return relation.guild_a_id;

    });

    const uniqueIds =
        [...new Set(otherGuildIds)];

    let guildMap = {};

    if (uniqueIds.length > 0) {

        const result =
            await supabaseClient
                .from("guilds")
                .select("id,name,tag,logo_url")
                .in("id", uniqueIds);

        if (!result.error && result.data) {

            result.data.forEach(item => {
                guildMap[item.id] = item;
            });
        }
    }

    const relationNames = {
        alliance: "Союз",
        neutral: "Нейтралитет",
        hostile: "Враждебные отношения"
    };

    const statusNames = {
        pending: "Ожидает подтверждения",
        accepted: "Принято",
        rejected: "Отклонено",
        terminated: "Прекращено"
    };

    content.innerHTML = `
        <h2>Дипломатия</h2>

        ${
            data.map(relation => {

                const otherId =
                    relation.guild_a_id === guild.id
                        ? relation.guild_b_id
                        : relation.guild_a_id;

                const other =
                    guildMap[otherId];

                return `
                    <div class="relation-card">

                        <div class="relation-name">

                            ${
                                other
                                ? escapeHtml(other.name)
                                : "Гильдия"
                            }

                            ${
                                other?.tag
                                ? " [" +
                                  escapeHtml(other.tag) +
                                  "]"
                                : ""
                            }

                        </div>

                        <div class="relation-status">

                            Отношение:
                            <strong>
                                ${escapeHtml(
                                    relationNames[
                                        relation.relation_type
                                    ] ||
                                    relation.relation_type
                                )}
                            </strong>

                            <br>

                            Статус:
                            ${escapeHtml(
                                statusNames[
                                    relation.status
                                ] ||
                                relation.status
                            )}

                        </div>

                    </div>
                `;

            }).join("")
        }

    `;
}

/* =========================================================
   ACCEPT APPLICATION
========================================================= */

async function acceptApplication(applicationId) {

    if (!canManageApplications()) {
        showToast(
            "Недостаточно прав.",
            "error"
        );
        return;
    }

    try {

        const {
            error
        } = await supabaseClient.rpc(
            "accept_guild_application",
            {
                p_application_id:
                    applicationId
            }
        );

        if (error) {
            throw error;
        }

        showToast(
            "Заявка принята.",
            "success"
        );

        await renderApplications();

    } catch (error) {

        console.error(error);

        showToast(
            error.message ||
            "Не удалось принять заявку.",
            "error"
        );
    }
}

    if (!canManage()) {

        );
        return;
    }

    const updates = {

            document.getElementById(
                "edit-name"
            ).value.trim(),

        tag:
            document.getElementById(
                "edit-tag"
            ).value.trim() || null,

        description:
            document.getElementById(
                "edit-description"
            ).value.trim(),

        logo_url:
            document.getElementById(
                "edit-logo"
            ).value.trim() || null,

        banner_url:
            document.getElementById(
                "edit-banner"
            ).value.trim() || null,

        website_url:
            document.getElementById(
                "edit-website"
            ).value.trim() || null,

        discord_url:
            document.getElementById(
                "edit-discord"
            ).value.trim() || null,

        is_public:
            document.getElementById(
                "edit-public"
            ).checked
    };

    if (!updates.name) {

        showToast(
            "Введите название гильдии.",
            "error"
        );

        return;
    }

    try {

        const {
            data,
            error
        } = await supabaseClient
            .from("guilds")
            .update(updates)
            .eq("id", guild.id)
            .select("*")
            .single();

        if (error) {
            throw error;
        }

        guild = data;

        renderGuildHero();

        showToast(
            "Изменения сохранены.",
            "success"
        );

        renderEdit();

    } catch (error) {

        console.error(error);

        showToast(
            error.message ||
            "Не удалось сохранить изменения.",
            "error"
        );
    }
}


/* =========================================================
   SECTION SWITCH
========================================================= */

async function openSection(section) {

    document
        .querySelectorAll(".guild-nav button")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.section === section
            );

        });

    try {

        if (section === "about") {
            renderAbout();
            return;
        }

        if (section === "news") {
            await renderNews();
            return;
        }

        if (section === "members") {
            await renderMembers();
            return;
        }

        if (section === "gallery") {
            await renderGallery();
            return;
        }

        if (section === "documents") {
            await renderDocuments();
            return;
        }

        if (section === "diplomacy") {
            await renderDiplomacy();
            return;
        }

        if (section === "applications") {
            await renderApplications();
            return;
        }

        if (section === "edit") {
            renderEdit();
            return;
        }

    } catch (error) {

        console.error(error);

        showSectionError(
            error.message ||
            "Ошибка загрузки раздела."
        );
    }
}


/* =========================================================
   NAV BUTTONS
========================================================= */

document
    .querySelectorAll(".guild-nav button")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {
                openSection(
                    button.dataset.section
                );
            }
        );

    });


/* =========================================================
   BACK
========================================================= */

document
    .getElementById("back-button")
    .addEventListener("click", () => {

        if (game?.id) {
            location.href =
                "game.html?id=" +
                encodeURIComponent(game.id);
        } else {
            location.href = "index.html";
        }

    });


/* =========================================================
   LOGOUT
========================================================= */

document
    .getElementById("logout-button")
    .addEventListener("click", async () => {

        try {

            await supabaseClient.auth.signOut();

        } finally {

            location.href =
                "index.html";
        }

    });


/* =========================================================
   INITIALIZATION
========================================================= */

async function init() {

    try {

        setLoading("Проверяем авторизацию...");

        const authorized =
            await loadUser();

        if (!authorized) {
            return;
        }

        setLoading("Загружаем профиль...");

        await loadProfile();

        setLoading("Загружаем гильдию...");

        await loadGuild();

        setLoading("Загружаем игру...");

        await loadGame();

        setLoading("Проверяем членство...");

        await loadMembership();

        renderGuildHero();

        updateNavigation();

        hideLoading();

        await openSection("about");

    } catch (error) {

        console.error(
            "Ошибка загрузки guild.html:",
            error
        );

        showFatalError(
            error.message ||
            "Неизвестная ошибка."
        );
    }
}


/* =========================================================
   START
========================================================= */

if (supabaseClient) {
    init();
}
</script>
