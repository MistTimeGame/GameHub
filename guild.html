<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Guild Page
</title>


<link rel="stylesheet" href="guild.css">


</head>


<body>



<div id="guildApp">







<header class="guild-header">


<a href="javascript:history.back()">

← Назад

</a>




<div id="userPanel">

</div>



</header>









<!-- ======================
BANNER
====================== -->


<section
id="guildBanner"
class="banner">


<div class="banner-overlay">


<img
id="guildLogo"
class="guild-logo"
>




<h1 id="guildName">

</h1>



<p id="guildTag">

</p>



</div>


</section>









<!-- ======================
MAIN INFO
====================== -->


<section class="guild-content">



<div class="info-card">



<h2>

О гильдии

</h2>




<p id="guildDescription">

</p>



<div id="factionBlock">


</div>



</div>








<!-- ======================
LEADER PANEL
====================== -->


<section
id="leaderPanel"
class="info-card"
hidden>



<h2>

Управление гильдией

</h2>



<button onclick="openGuildSettings()">

⚙ Настройки темы

</button>



<button onclick="openMembers()">

👥 Участники

</button>




</section>









<!-- ======================
SETTINGS
====================== -->


<section
id="guildSettings"
class="info-card"
hidden>



<h2>

Оформление

</h2>





<label>

Цвет темы

</label>


<input
id="themeColor"
type="color"
>





<label>

Цвет кнопок

</label>


<input
id="buttonColor"
type="color"
>





<label>

Стиль кнопок

</label>



<select id="buttonStyle">


<option value="round">

Круглые

</option>


<option value="square">

Квадратные

</option>


<option value="soft">

Скруглённые

</option>


</select>







<label>

Фон страницы

</label>



<input
id="backgroundUrl"
placeholder="URL изображения"
>







<label>

Баннер

</label>



<input
id="bannerUrl"
placeholder="URL баннера"
>







<label>

Флаг фракции

</label>



<input
id="factionName"
placeholder="Название фракции"
>





<input
id="factionFlag"
placeholder="URL флага"
>








<button onclick="saveGuildSettings()">

Сохранить

</button>






</section>









<!-- ======================
MEMBERS
====================== -->


<section
id="membersPanel"
class="info-card"
hidden>



<h2>

Участники

</h2>



<div id="membersList">

</div>



</section>









</section>









</div>







<div id="siteVersion">

</div>







<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="version.js"></script>

<script src="guild.js"></script>



</body>

</html>
