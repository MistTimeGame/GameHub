<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Guild Page
</title>


<link rel="stylesheet" href="guild.css">


</head>


<body>


<div id="guildApp">



<!-- =========================
 HEADER
========================= -->


<header class="guild-header">


<a href="javascript:history.back()">

← Назад

</a>



<div id="userPanel">

</div>


</header>







<!-- =========================
 GUILD BANNER
========================= -->


<section id="guildBanner" class="banner">



<div class="banner-overlay">



<img
id="guildLogo"
class="guild-logo"
src=""
>



<h1 id="guildName">

Загрузка...

</h1>




<div id="guildTag">

</div>



</div>



</section>









<!-- =========================
 CONTENT
========================= -->


<main class="guild-content">





<section class="info-card">


<h2>

О гильдии

</h2>



<p id="guildDescription">

</p>




<div id="factionBlock">

</div>



</section>









<!-- =========================
 LEADER PANEL
========================= -->


<section

id="leaderPanel"

class="info-card"

hidden>


<h2>

Панель главы

</h2>



<p>

Вам доступны настройки гильдии.

</p>



<button onclick="openGuildSettings()">

⚙ Настройки оформления

</button>




<button onclick="openMembers()">

👥 Участники

</button>



</section>









<!-- =========================
 SETTINGS
========================= -->


<section

id="guildSettings"

class="info-card"

hidden>



<h2>

Оформление гильдии

</h2>





<label>

Цвет темы

</label>


<input

id="themeColor"

type="color"

value="#ffffff"

>







<label>

Цвет кнопок

</label>


<input

id="buttonColor"

type="color"

value="#ffcc00"

>








<label>

Форма кнопок

</label>


<select id="buttonStyle">


<option value="round">

Круглые

</option>


<option value="soft">

Мягкие

</option>


<option value="square">

Квадратные

</option>



</select>









<label>

Фоновое изображение страницы

</label>


<input

id="backgroundUrl"

placeholder="https://..."

>








<label>

Баннер гильдии

</label>


<input

id="bannerUrl"

placeholder="https://..."

>









<h3>

Фракция

</h3>



<label>

Название фракции

</label>


<input

id="factionName"

placeholder="Например: Антилия"

>





<label>

Флаг фракции

</label>


<input

id="factionFlag"

placeholder="URL флага"

>





<button onclick="saveGuildSettings()">

💾 Сохранить

</button>




</section>









<!-- =========================
 MEMBERS
========================= -->


<section

id="membersPanel"

class="info-card"

hidden>


<h2>

Участники

</h2>



<div id="membersList">

</div>



</section>









</main>







</div>







<!-- VERSION -->

<div id="siteVersion">

</div>







<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="supabase-config.js"></script>


<script src="version.js"></script>


<script src="guild.js"></script>



</body>


</html>
