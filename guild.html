<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Гильдия
</title>


<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="guild.css">


</head>


<body>



<div id="guildPage">



<header class="guild-header">



<div class="guild-images">


<img
id="guildLogo"
class="guild-logo"
src=""
alt="Логотип"
>



<img
id="factionFlag"
class="faction-flag"
src=""
alt="Фракция"
>



</div>





<div class="guild-title">


<h1 id="guildName">
Загрузка...
</h1>



<p id="guildTag">

</p>



<p id="guildFaction">

</p>



</div>



</header>






<div
id="guildBanner"
class="guild-banner">

</div>








<nav class="guild-nav">


<button onclick="openGuildTab('about')">

О гильдии

</button>


<button onclick="openGuildTab('members')">

Участники

</button>



<button onclick="openGuildTab('news')">

Новости

</button>



<button onclick="openGuildTab('gallery')">

Галерея

</button>



<button onclick="openGuildTab('documents')">

Документы

</button>



<button onclick="openGuildTab('diplomacy')">

Дипломатия

</button>



<button onclick="openGuildTab('settings')"
id="settingsButton"
hidden
>

⚙ Управление

</button>


</nav>










<main>





<section
id="about"
class="guild-tab"
>



<h2>
О гильдии
</h2>



<p id="guildDescription">

</p>



</section>









<section
id="members"
class="guild-tab"
hidden
>


<h2>
Участники
</h2>



<div id="membersList">

</div>



<div id="memberControl" hidden>


<input
id="memberUser"
placeholder="ID игрока"
>



<input
id="memberNickname"
placeholder="Никнейм"
>



<select id="memberRole">


<option value="member">

Участник

</option>


<option value="officer">

Офицер

</option>


<option value="diplomat">

Дипломат

</option>


</select>



<button onclick="addMember()">

Добавить

</button>


</div>



</section>









<section
id="news"
class="guild-tab"
hidden
>


<h2>
Новости
</h2>


<div id="newsList">

</div>




<div id="newsControl" hidden>


<input
id="newsTitle"
placeholder="Заголовок"
>



<textarea
id="newsText"
placeholder="Текст новости">
</textarea>



<button onclick="createNews()">

Добавить

</button>


</div>



</section>









<section
id="gallery"
class="guild-tab"
hidden
>


<h2>
Галерея
</h2>



<div id="galleryList">

</div>



<div id="galleryControl" hidden>


<input
type="file"
id="galleryFile"
>



<button onclick="uploadGallery()">

Загрузить

</button>



</div>



</section>









<section
id="documents"
class="guild-tab"
hidden
>


<h2>
Документы

</h2>


<div id="documentsList">

</div>



<div id="documentControl" hidden>


<input
type="file"
id="documentFile"
>



<button onclick="uploadDocument()">

Загрузить

</button>



</div>


</section>









<section
id="diplomacy"
class="guild-tab"
hidden
>


<h2>
Дипломатия
</h2>



<div id="relationsList">

</div>



<div id="diplomacyControl" hidden>


<button onclick="createAlliance()">

Предложить союз

</button>


</div>



</section>









<section
id="settings"
class="guild-tab"
hidden
>


<h2>
Настройки гильдии
</h2>





<h3>
Основная информация
</h3>


<input
id="editName"
placeholder="Название"
>



<input
id="editTag"
placeholder="Тег"
>



<textarea
id="editDescription">
</textarea>



<button onclick="saveGuild()">

Сохранить

</button>









<h3>
Оформление
</h3>



<label>
Цвет темы
</label>


<input
type="color"
id="themeColor"
>



<label>
Цвет кнопок
</label>


<input
type="color"
id="buttonColor"
>




<label>
Форма кнопок
</label>



<select id="buttonStyle">


<option value="rounded">

Скруглённые

</option>



<option value="square">

Квадратные

</option>



<option value="circle">

Круглые

</option>



</select>




<button onclick="saveTheme()">

Сохранить тему

</button>









<h3>
Изображения
</h3>



<input
type="file"
id="logoFile"
>



<button onclick="uploadLogo()">

Логотип

</button>





<input
type="file"
id="bannerFile"
>



<button onclick="uploadBanner()">

Баннер

</button>





<h3>
Фракция

</h3>


<input
id="factionName"
placeholder="Название фракции"
>



<input
type="file"
id="flagFile"
>



<button onclick="uploadFlag()">

Установить флаг

</button>



</section>






</main>


</div>







<div id="siteVersion"></div>







<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="supabase-config.js"></script>


<script src="version.js"></script>


<script src="guild.js"></script>



</body>

</html>
