<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Гильдия</title>


<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="guild.css">


</head>


<body>


<div id="guildPage">



<!-- =========================
 HEADER
========================= -->


<header class="guild-header">


<div class="guild-images">


<img 
id="guildLogo"
class="guild-logo"
src=""
alt="logo"
>


<img
id="factionFlag"
class="faction-flag"
src=""
alt="flag"
>


</div>




<div class="guild-title">


<h1 id="guildName">
Загрузка...
</h1>


<p id="guildFaction">
</p>


</div>


</header>






<!-- =========================
 BANNER
========================= -->


<div 
id="guildBanner"
class="guild-banner"
>

</div>







<!-- =========================
 NAVIGATION
========================= -->


<nav class="guild-nav">


<button onclick="openTab('about')">
О нас
</button>


<button onclick="openTab('news')">
Новости
</button>


<button onclick="openTab('members')">
Участники
</button>


<button onclick="openTab('gallery')">
Галерея
</button>


<button onclick="openTab('documents')">
Документы
</button>


<button onclick="openTab('diplomacy')">
Дипломатия
</button>


<button onclick="openTab('applications')">
Заявки
</button>


<button 
id="leaderPanelButton"
onclick="openTab('settings')"
hidden
>
⚙ Управление
</button>


</nav>







<main>






<!-- =========================
 ABOUT
========================= -->


<section 
id="about"
class="tab"
>


<h2>
О нас
</h2>



<p id="guildDescription">
</p>




<div id="descriptionEdit" hidden>


<textarea
id="descriptionInput"
placeholder="Описание гильдии">
</textarea>


<button onclick="saveDescription()">
Сохранить
</button>


</div>



</section>









<!-- =========================
 NEWS
========================= -->


<section
id="news"
class="tab"
hidden
>


<h2>
Новости
</h2>


<div id="newsList">

</div>



<div id="newsCreate" hidden>


<input
id="newsTitle"
placeholder="Заголовок"
>


<textarea
id="newsText"
placeholder="Текст новости">
</textarea>


<button onclick="createNews()">
Добавить новость
</button>


</div>


</section>









<!-- =========================
 MEMBERS
========================= -->


<section
id="members"
class="tab"
hidden
>


<h2>
Участники
</h2>


<div id="membersList">

</div>




<div id="memberCreate" hidden>


<input
id="memberNickname"
placeholder="Никнейм игрока"
>


<select id="memberRole">


<option value="member">
Участник
</option>


<option value="officer">
Офицер
</option>


<option value="diplomat">
Дипломат
</option>


</select>



<button onclick="addMember()">
Добавить
</button>


</div>



</section>









<!-- =========================
 GALLERY
========================= -->


<section
id="gallery"
class="tab"
hidden
>


<h2>
Галерея
</h2>


<div id="galleryList">

</div>




<div id="galleryCreate" hidden>


<input
type="file"
id="galleryFile"
>


<button onclick="uploadGallery()">
Загрузить изображение
</button>


</div>



</section>









<!-- =========================
 DOCUMENTS
========================= -->


<section
id="documents"
class="tab"
hidden
>


<h2>
Документы
</h2>


<div id="documentsList">

</div>




<div id="documentCreate" hidden>


<input
type="file"
id="documentFile"
>


<button onclick="uploadDocument()">
Загрузить документ
</button>


</div>



</section>









<!-- =========================
 DIPLOMACY
========================= -->


<section
id="diplomacy"
class="tab"
hidden
>


<h2>
Дипломатия
</h2>


<div id="relationsList">

</div>



<button
id="allianceCreate"
hidden
onclick="createAlliance()"
>

Создать союз

</button>



</section>









<!-- =========================
 APPLICATIONS
========================= -->


<section
id="applications"
class="tab"
hidden
>


<h2>
Заявки
</h2>


<div id="applicationsList">

</div>



</section>









<!-- =========================
 SETTINGS
========================= -->


<section
id="settings"
class="tab"
hidden
>


<h2>
Управление гильдией
</h2>




<h3>
Основная информация
</h3>



<input
id="editGuildName"
placeholder="Название"
>


<textarea
id="editGuildDescription"
placeholder="Описание">
</textarea>








<h3>
Оформление
</h3>



<label>
Цвет темы
</label>


<input
type="color"
id="themeColor"
>





<label>
Цвет кнопок
</label>


<input
type="color"
id="buttonColor"
>






<label>
Форма кнопок
</label>


<select id="buttonStyle">


<option value="rounded">
Скругленные
</option>


<option value="circle">
Круглые
</option>


<option value="square">
Квадратные
</option>


</select>








<h3>
Логотип
</h3>


<input
type="file"
id="logoFile"
>


<button onclick="uploadLogo()">
Загрузить логотип
</button>







<h3>
Баннер страницы
</h3>


<input
type="file"
id="bannerFile"
>


<button onclick="uploadBanner()">
Загрузить баннер
</button>








<h3>
Фракция
</h3>


<input
id="factionName"
placeholder="Название фракции"
>



<input
type="file"
id="factionFile"
>



<button onclick="uploadFactionFlag()">
Установить флаг
</button>







<h3>
Фон страницы
</h3>


<input
type="file"
id="backgroundFile"
>


<button onclick="saveTheme()">
Сохранить оформление
</button>




</section>





</main>




</div>






<!-- =========================
 VERSION
========================= -->


<div id="siteVersion">

</div>








<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="supabase-config.js"></script>


<script src="version.js"></script>


<script src="guild.js"></script>



</body>

</html>
