<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Игра
</title>


<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="game.css">


</head>


<body>



<div id="gamePage">



<header class="game-header">


<img
id="gameLogo"
class="game-logo"
src=""
alt="Логотип"
>


<div>


<h1 id="gameName">
Загрузка...
</h1>


<p id="gameDescription">

</p>


</div>


</header>








<nav class="game-menu">


<button onclick="openGameTab('guilds')">

Гильдии

</button>


<button onclick="openGameTab('info')">

Информация

</button>


<button onclick="openGameTab('modules')">

Модули

</button>



<button
id="createGuildButton"
onclick="openCreateGuild()"
>

Создать гильдию

</button>



</nav>









<main>





<section
id="guilds"
class="game-tab"
>


<h2>
Гильдии
</h2>



<div id="guildsList">

</div>





<section
id="createGuild"
class="card"
hidden
>



<h3>
Новая гильдия
</h3>



<input
id="guildNameInput"
placeholder="Название гильдии"
>



<input
id="guildTagInput"
placeholder="Тег"
>



<textarea
id="guildDescriptionInput"
placeholder="Описание">
</textarea>



<input
id="guildLogoInput"
placeholder="Ссылка на логотип"
>




<button onclick="createGuild()">

Создать

</button>



</section>


</section>









<section
id="info"
class="game-tab"
hidden
>


<h2>
Информация об игре
</h2>



<div id="gameInfo">

</div>


</section>









<section
id="modules"
class="game-tab"
hidden
>


<h2>
Модули игры
</h2>



<div id="modulesList">

</div>


</section>








</main>





</div>





<div id="siteVersion"></div>






<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="version.js"></script>

<script src="game.js"></script>


</body>

</html>
