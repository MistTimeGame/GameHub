<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Game Page
</title>


<link rel="stylesheet" href="game.css">


</head>


<body>


<div class="game-wrapper">





<header class="game-header">


<a href="index.html">

← Назад

</a>



<div id="profileBlock">

</div>


</header>









<section id="gameInfo"
class="game-card">


<img id="gameLogo">


<h1 id="gameName">

</h1>



<p id="gameDescription">

</p>



</section>









<section class="guild-section">



<div class="guild-title">


<h2>

Гильдии

</h2>



<button onclick="openCreateGuild()">

+ Создать гильдию

</button>



</div>







<input
id="guildSearch"
placeholder="Поиск гильдий..."
oninput="searchGuilds()"
>






<div id="guildList"
class="guild-grid">


</div>



</section>









<section id="createGuild"
class="create-box"
hidden>


<h2>

Создание гильдии

</h2>




<input
id="guildName"
placeholder="Название гильдии"
>





<input
id="guildTag"
placeholder="Тег"
>




<textarea
id="guildDescription"
placeholder="Описание">
</textarea>





<button onclick="createGuild()">

Создать

</button>



</section>









</div>








<div id="siteVersion">

</div>







<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="version.js"></script>

<script src="game.js"></script>


</body>

</html>
